# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit Configuration for RMFrontend
# Docs: https://docs.coderabbit.ai/guides/configure-coderabbit

language: "en-US"

tone_instructions: "Be concise and constructive. Focus on actionable feedback."

early_access: false
enable_free_tier: true

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  changed_files_summary: true
  labeling_instructions: []
  
  auto_review:
    enabled: true
    drafts: false
    base_branches: 
      - "main"
      - "dev"

  path_instructions:
    - path: "src/**/*.tsx"
      instructions: |
        Review for:
        - React best practices and hooks usage
        - Component composition and reusability
        - Proper TypeScript typing
        - Accessibility (a11y) considerations
        - Performance (unnecessary re-renders, memo usage)
    
    - path: "src/**/*.ts"
      instructions: |
        Review for:
        - TypeScript best practices
        - Proper error handling
        - Type safety
        - Clean code principles
    
    - path: "src/components/**/*"
      instructions: |
        Review for:
        - Component naming conventions
        - Props interface definitions
        - Proper separation of concerns

path_filters:
  - "!**/*.lock"
  - "!**/package-lock.json"
  - "!**/node_modules/**"
  - "!**/.git/**"
  - "!**/*.min.js"
  - "!**/*.min.css"
  - "!**/dist/**"
  - "!**/build/**"
  - "!**/.DS_Store"
  - "!**/coverage/**"

chat:
  auto_reply: true
